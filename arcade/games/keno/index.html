<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Number Nebula</title>
<link rel="stylesheet" href="../../commonFrame/ui.css">
<link rel="stylesheet" href="keno.css">
</head>
<body>
  <header class="game-head">
    <button class="btn ghost" id="back">&#9664; LOBBY</button>
    <h1>Number Nebula</h1>
    <span class="grow"></span>
    <span class="wallet"><span class="coin">&#9673;</span><b id="balance">0</b><span class="unit">TKN</span></span>
  </header>

  <main class="game-body keno">
    <section class="board">
      <div class="numbers" id="numbers"></div>

      <div class="controls">
        <div class="control">
          <label for="bet">Stake</label>
          <div class="stepper">
            <button class="btn ghost" id="betDown" aria-label="Decrease stake">&#8722;</button>
            <b id="bet">5</b>
            <button class="btn ghost" id="betUp" aria-label="Increase stake">+</button>
          </div>
        </div>
        <button class="btn ghost" id="quick">QUICK PICK</button>
        <button class="btn ghost" id="clear">CLEAR</button>
        <button class="btn spin" id="draw">DRAW</button>
      </div>

      <div class="readout" id="readout">Pick up to 10 numbers, then draw 20 of 80.</div>
    </section>

    <aside class="side">
      <h2>Paytable &mdash; picks <span id="pickCount">0</span></h2>
      <table id="paytable"></table>
      <p class="disclosure" id="disclosure"></p>
    </aside>
  </main>

  <div id="toast"></div>
  <script type="module" src="keno.js"></script>
</body>
</html>
