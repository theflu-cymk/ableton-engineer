[project]
name = "enableton"
version = "0.1.0"
description = "Ableton Live MCP server: inspect, repair and build a Live Set."
requires-python = ">=3.11"
dependencies = ["mcp>=2.3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
enableton = "enableton.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/enableton"]

[tool.pytest.ini_options]
pythonpath = ["src", "remote_script"]
testpaths = ["tests"]
