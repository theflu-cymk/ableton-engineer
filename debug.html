<!doctype html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#08080c;color:#c8c8d8;font:10px/1.3 monospace;overflow:hidden}
#g{display:flex;flex-wrap:wrap;width:750px}.c{width:250px}
.c canvas{display:block;width:250px;height:445px}.p{padding:2px 4px;color:#9a9ab0}
</style></head><body><div id="g"></div>
<script id="frag" type="x-shader/x-fragment">
precision mediump float;

uniform vec2  uParam;
uniform vec2  iResolution;
uniform float iTime;
uniform float uSpeed;
uniform float uLineCount;
uniform float uAmplitude;
uniform float uYOffset;
uniform vec3  uBgColor1;
uniform vec3  uBgColor2;
uniform vec3  uWaveColor1;
uniform vec3  uWaveColor2;

const float MAX_LINES = 20.0;
const float COS30     = 0.86602540;
const float TAU       = 6.28318530;
const float PERIOD    = 1.0;    // octaves of radius per crater (= one zoom cycle)
const float CLIMB     = 0.70;   // share of the period spent climbing to the rim
const float RISER     = 0.22;   // share of each ring that is vertical face

float hash1(float n) { return fract(sin(n * 12.9898) * 43758.5453); }

/* crater profile along one period of log radius: 0 at the floor, 1 at the rim */
float prof(float u) {
  return u < CLIMB ? u / CLIMB : (1.0 - u) / (1.0 - CLIMB);
}

/* Concentric rings of constant width in log radius: a flat tread per ring and
   a near vertical riser at its outer edge. Because the rings keep the same
   width everywhere, the rim turns into a few tall, chunky steps instead of a
   smooth cliff, and each ring reads as one row of cubes. */
float stoneH(vec2 xz, float N, float D, float sec, float px) {
  float r = max(abs(xz.x), abs(xz.y));
  float u = fract(log2(max(r, 1e-5)) / PERIOD);

  float Mu = max(2.0, N);                      // rings per period
  float st = 1.0 / Mu;
  float fr = fract(u * Mu);
  float iu = floor(u * Mu);

  float cone = -D * (1.0 - prof(u));

  float tw  = r * 0.6931 * st;                 // ring width in world units
  float lod = smoothstep(0.6, 3.6, tw / px);   // rings thinner than a pixel fade
  if (lod < 0.001) return cone;

  // flat tread, then a short ramp up to the next ring at the outer edge
  float va = prof(iu * st);
  float vb = prof(min((iu + 1.0) * st, 1.0));
  float vv = mix(va, vb, smoothstep(1.0 - RISER, 1.0, fr));
  float h  = -D * (1.0 - vv);

  float stH = abs(vb - va) * D + 1e-4;          // riser height at this ring

  // shallow groove along the block seams, small offsets between blocks
  float a  = fract(atan(xz.y, xz.x) * (sec / TAU));
  float f  = abs(a - 0.5) * 2.0;               // 1 = centre of a block
  float sm = 1.0 - smoothstep(0.86, 0.995, f);
  h -= stH * 0.45 * sm * lod;
  h += stH * 0.30 * (hash1(a * 61.0 + iu * 7.13) - 0.5) * (1.0 - sm) * lod;

  return mix(cone, h, lod);
}

void main() {
  float px = 1.0 / iResolution.y;
  vec2  p  = (gl_FragCoord.xy - 0.5 * iResolution.xy) * px;

  /* ---- one whole crater period per zoom cycle, so the loop is exact */
  float rate = 0.15 * max(uSpeed, 0.0) * (uParam.x > 0.0 ? uParam.x : 1.0);
  float zs   = exp2(-PERIOD * fract(iTime * rate));

  vec2 w  = (p + vec2(0.0, uYOffset - 0.20)) * zs;
  vec3 bg = mix(uBgColor2, uBgColor1, clamp(0.55 - p.y * 1.3, 0.0, 1.0));

  /* ---- axonometric ray: x - z is constant, y and (x+z)/2 drop with t */
  float A    = w.x / COS30;
  float c    = 0.5 * abs(A);
  float YTOP = 0.02;
  float s0   = w.y + YTOP;

  float N   = clamp(floor(uLineCount + 0.5), 2.0, MAX_LINES);
  float D   = clamp(uAmplitude, 0.05, 1.5);
  float sec = 9.0 * N;
  float Mu  = max(2.0, N);

  // nothing lives below -D, so the ray can stop there: that bounds the loop
  // and lets the step stay well under one tread, which keeps edges crisp
  float TMAX = YTOP + D + 0.05;
  float st   = max(D / (CLIMB * Mu) * 0.15, TMAX / 126.0);

  float t = 0.0, t0 = 0.0;
  bool hit = false;
  for (int i = 0; i < 128; i++) {
    if (t > TMAX) break;
    float s  = s0 - t;
    vec2  xz = vec2(s + 0.5 * A, s - 0.5 * A);
    if (YTOP - t <= stoneH(xz, N, D, sec, px)) { hit = true; break; }
    t0 = t;
    t += st;
  }
  if (!hit) { gl_FragColor = vec4(bg, 1.0); return; }

  for (int i = 0; i < 6; i++) {
    float tm = 0.5 * (t0 + t);
    float s  = s0 - tm;
    vec2  xz = vec2(s + 0.5 * A, s - 0.5 * A);
    if (YTOP - tm <= stoneH(xz, N, D, sec, px)) t = tm; else t0 = tm;
  }

  float y  = YTOP - t;
  float s  = s0 - t;
  float x  = s + 0.5 * A;
  float z  = s - 0.5 * A;
  vec2  xz = vec2(x, z);

  float r  = abs(s) + c;
  float tw = r * 0.6931 / Mu;

  // normal step below one tread, so each face stays flat
  float e  = max(tw * 0.30, zs * px * 2.0);
  float h0 = stoneH(xz, N, D, sec, px);
  vec3  nrm = normalize(vec3(
      -(stoneH(xz + vec2(e, 0.0), N, D, sec, px) - h0) / e,
      1.0,
      -(stoneH(xz + vec2(0.0, e), N, D, sec, px) - h0) / e));

  float up   = clamp(nrm.y, 0.0, 1.0);
  float wall = 1.0 - up;

  float lod = smoothstep(0.6, 3.6, tw / px);
  float uu  = fract(log2(max(r, 1e-5)) / PERIOD);
  float fr  = fract(uu * Mu);
  float iu  = floor(uu * Mu);

  float a    = fract(atan(z, x) * (sec / TAU));
  float f    = abs(a - 0.5) * 2.0;
  float seam = 1.0 - smoothstep(0.86, 0.995, f);

  vec2  nh   = nrm.xz;
  float nhL  = length(nh);
  float warm = 0.5 + 0.5 * (nhL > 1e-5 ? dot(nh / nhL, vec2(-0.92, 0.40)) : 0.0);

  float deep = clamp((y + D) / max(D, 1e-4), 0.0, 1.0);
  vec3  top  = mix(uWaveColor1, vec3(1.0, 0.97, 0.94), 0.30) * (0.92 + 0.12 * deep);
  vec3  side = mix(uWaveColor2 * vec3(0.94, 0.93, 1.04),
                   uWaveColor1 * vec3(1.03, 0.90, 0.87), warm) * 0.94;

  vec3  albedo = mix(side, top, smoothstep(0.55, 0.90, up));
  vec3  L      = normalize(vec3(-0.45, 0.80, 0.40));
  float dif    = max(dot(nrm, L), 0.0);
  float sky    = 0.55 + 0.45 * nrm.y;
  vec3  col    = albedo * (0.34 + 0.36 * dif + 0.30 * sky);
  col *= 0.62 + 0.38 * deep;

  // crease at the foot of every riser, a line along every block seam and a
  // small tone change per block: together they separate the cubes
  col *= 0.78 + 0.22 * smoothstep(0.04, 0.30, fr) * lod + 0.22 * (1.0 - lod);
  col *= 1.0 - 0.28 * seam * lod;
  col *= 1.0 - 0.10 * hash1(floor(a * sec) * 1.7 + iu * 3.1) * lod;

  // fine vertical hatching on the walls, dropped once it goes sub-pixel
  float per   = TAU * max(r, 1e-4) / (640.0 * px);   // pixels per stripe
  float fade  = smoothstep(1.5, 3.0, per);
  float strip = 0.5 + 0.5 * sin(atan(z, x) * 640.0);
  col *= 1.0 - 0.12 * wall * strip * fade;

  float fog = 1.0 - exp(-max(t - 0.55, 0.0) * 1.2);
  col = mix(col, bg, clamp(fog, 0.0, 0.55));

  if (uParam.y > 2.5)      gl_FragColor = vec4(vec3(lod), 1.0);
  else if (uParam.y > 1.5) gl_FragColor = vec4(vec3(up), 1.0);
  else if (uParam.y > 0.5) gl_FragColor = vec4(vec3(clamp(t, 0.0, 1.2) / 1.2), 1.0);
  else gl_FragColor = vec4(col, 1.0);
}

</script>
<script>
(function(){
 var vs='attribute vec2 a; void main(){ gl_Position=vec4(a,0.0,1.0); }';
 var fs=document.getElementById('frag').textContent;
 var modes=[['colour',0],['hit t',1],['up normal',2],['lod',3]];
 function sh(gl,t,s){var o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);
  if(!gl.getShaderParameter(o,gl.COMPILE_STATUS)){document.body.insertAdjacentHTML('beforeend','<pre style="color:#f88">'+gl.getShaderInfoLog(o)+'</pre>');throw 0;}return o;}
 modes.forEach(function(m){
  var c=document.createElement('div');c.className='c';
  var cv=document.createElement('canvas');cv.width=250;cv.height=445;
  var cap=document.createElement('div');cap.className='p';cap.textContent=m[0];
  c.appendChild(cv);c.appendChild(cap);document.getElementById('g').appendChild(c);
  var gl=cv.getContext('webgl',{antialias:false,preserveDrawingBuffer:true});
  var pr=gl.createProgram();
  gl.attachShader(pr,sh(gl,gl.VERTEX_SHADER,vs));
  gl.attachShader(pr,sh(gl,gl.FRAGMENT_SHADER,fs));
  gl.linkProgram(pr);gl.useProgram(pr);
  var b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  var l=gl.getAttribLocation(pr,'a');gl.enableVertexAttribArray(l);
  gl.vertexAttribPointer(l,2,gl.FLOAT,false,0,0);gl.viewport(0,0,250,445);
  var U={};['uParam','iResolution','iTime','uSpeed','uLineCount','uAmplitude','uYOffset','uBgColor1','uBgColor2','uWaveColor1','uWaveColor2'].forEach(function(n){U[n]=gl.getUniformLocation(pr,n);});
  gl.uniform2fv(U.iResolution,[250,445]);
  gl.uniform1f(U.uSpeed,1.0);gl.uniform1f(U.uLineCount,16.0);gl.uniform1f(U.uAmplitude,0.25);
  gl.uniform1f(U.uYOffset,0.0);gl.uniform2fv(U.uParam,[1.0,m[1]]);
  gl.uniform3fv(U.uBgColor1,[0.66,0.60,0.78]);gl.uniform3fv(U.uBgColor2,[0.98,0.93,0.91]);
  gl.uniform3fv(U.uWaveColor1,[1.00,0.83,0.75]);gl.uniform3fv(U.uWaveColor2,[0.58,0.55,0.79]);
  gl.uniform1f(U.iTime,0.33/0.15);
  gl.drawArrays(gl.TRIANGLES,0,3);
 });
})();
</script></body></html>
